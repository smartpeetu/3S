<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Grid -->
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <!-- Main Gradient Schemes -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="25%" stop-color="#00b4d8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="90%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="deepNavyGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="electricRibbon" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="chromeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#38bdf8" opacity="0.45" />
    </pattern>

    <!-- Hexagonal Honeycomb Pattern -->
    <pattern id="hexPattern" x="0" y="0" width="16" height="28" patternUnits="userSpaceOnUse">
      <path d="M 8,0 L 16,4.5 L 16,13.5 L 8,18 L 0,13.5 L 0,4.5 Z" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.4" />
      <path d="M 8,18 L 16,22.5 L 16,31.5 L 8,36 L 0,31.5 L 0,22.5 Z" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <!-- Radial Glow Filters -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Paper Canvas -->
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#bgGrid)" />
  <circle cx="400" cy="270" r="240" fill="url(#centerGlow)" />

  <!-- Neural Constellation Network (Top Right) -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" fill="none">
    <line x1="680" y1="80" x2="740" y2="120" />
    <line x1="740" y1="120" x2="710" y2="180" />
    <line x1="710" y1="180" x2="770" y2="230" />
    <line x1="740" y1="120" x2="780" y2="100" />
    <line x1="680" y1="80" x2="630" y2="140" />
    <line x1="630" y1="140" x2="670" y2="210" />
    <line x1="670" y1="210" x2="710" y2="180" />
    <line x1="770" y1="230" x2="730" y2="310" />
    <line x1="710" y1="180" x2="650" y2="270" />
    <line x1="650" y1="270" x2="690" y2="340" />
  </g>
  <g fill="#0284c7">
    <circle cx="680" cy="80" r="4.5" fill="#0284c7" />
    <circle cx="740" cy="120" r="6" fill="#38bdf8" />
    <circle cx="710" cy="180" r="5" fill="#0284c7" />
    <circle cx="770" cy="230" r="4" fill="#00e5ff" />
    <circle cx="780" cy="100" r="3.5" fill="#38bdf8" />
    <circle cx="630" cy="140" r="3.5" fill="#0284c7" />
    <circle cx="670" cy="210" r="4.5" fill="#38bdf8" />
    <circle cx="730" cy="310" r="3.5" fill="#0284c7" />
    <circle cx="650" cy="270" r="4" fill="#38bdf8" />
    <circle cx="690" cy="340" r="4.5" fill="#00e5ff" />
  </g>

  <!-- Neural Constellation Network (Bottom Left) -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" fill="none">
    <line x1="100" y1="390" x2="140" y2="440" />
    <line x1="140" y1="440" x2="80" y2="500" />
    <line x1="80" y1="500" x2="160" y2="540" />
    <line x1="140" y1="440" x2="200" y2="480" />
    <line x1="200" y1="480" x2="230" y2="420" />
    <line x1="50" y1="440" x2="100" y2="390" />
    <line x1="50" y1="440" x2="80" y2="500" />
  </g>
  <g fill="#0284c7">
    <circle cx="100" cy="390" r="4.5" fill="#0284c7" />
    <circle cx="140" cy="440" r="5.5" fill="#38bdf8" />
    <circle cx="80" cy="500" r="4.5" fill="#0284c7" />
    <circle cx="160" cy="540" r="4" fill="#00e5ff" />
    <circle cx="200" cy="480" r="3.5" fill="#38bdf8" />
    <circle cx="230" cy="420" r="3.5" fill="#0284c7" />
    <circle cx="50" cy="440" r="3.5" fill="#38bdf8" />
  </g>

  <!-- PCB Circuit Traces Radiating From Emblem -->
  <g stroke="#38bdf8" stroke-width="1.6" fill="none" opacity="0.8">
    <!-- Left PCB Traces -->
    <path d="M 300,170 H 220 L 190,140 H 130" />
    <path d="M 290,200 H 230 L 200,170 H 140" />
    <path d="M 280,230 H 225 L 195,260 H 120" />
    <path d="M 275,270 H 200 L 175,295 H 130" />
    <path d="M 280,310 H 220 L 190,340 H 150" />
    <path d="M 290,340 H 235 L 205,370 H 140" />
    <path d="M 310,370 H 250 L 220,400 H 160" />

    <!-- Right PCB Traces -->
    <path d="M 500,170 H 570 L 600,140 H 660" />
    <path d="M 510,200 H 580 L 610,230 H 670" />
    <path d="M 520,240 H 585 L 615,270 H 675" />
    <path d="M 525,280 H 595 L 620,305 H 665" />
    <path d="M 520,320 H 580 L 610,350 H 660" />
    <path d="M 505,355 H 565 L 595,385 H 650" />
    <path d="M 490,385 H 545 L 575,415 H 635" />
  </g>

  <!-- Circuit Terminal Pads -->
  <g fill="#0284c7" stroke="#38bdf8" stroke-width="1.2">
    <circle cx="130" cy="140" r="3.5" />
    <circle cx="140" cy="170" r="3.5" />
    <circle cx="120" cy="260" r="4" fill="#38bdf8" />
    <circle cx="130" cy="295" r="3" />
    <circle cx="150" cy="340" r="3.5" />
    <circle cx="140" cy="370" r="3.5" />
    <circle cx="160" cy="400" r="4" fill="#38bdf8" />

    <circle cx="660" cy="140" r="3.5" />
    <circle cx="670" cy="230" r="4" fill="#38bdf8" />
    <circle cx="675" cy="270" r="3" />
    <circle cx="665" cy="305" r="3.5" />
    <circle cx="660" cy="350" r="3.5" />
    <circle cx="650" cy="385" r="4" fill="#38bdf8" />
    <circle cx="635" cy="415" r="3" />
  </g>

  <!-- Hexagonal Honeycomb behind center -->
  <rect x="360" y="210" width="80" height="100" fill="url(#hexPattern)" opacity="0.7" />

  <!-- ========================================== -->
  <!-- 3S SCULPTED EMBLEM                         -->
  <!-- ========================================== -->
  <g transform="translate(180, 70) scale(1.0)">

    <!-- NUMBER '3' RIBBON -->
    <!-- 3: Upper Loop Base -->
    <path
      d="M 125,128 C 135,88 175,70 220,74 C 265,78 285,108 275,142 C 266,172 235,188 198,194 C 185,196 182,192 192,186 C 220,172 245,152 240,126 C 235,98 202,88 170,95 C 145,100 135,112 125,128 Z"
      fill="url(#deepNavyGrad)"
    />
    <!-- 3: Upper Loop Main Face -->
    <path
      d="M 132,124 C 140,82 180,64 228,68 C 275,72 296,104 286,140 C 276,175 240,192 205,198 C 190,200 188,194 200,188 C 230,174 256,150 250,122 C 244,92 206,82 172,90 C 148,96 138,108 132,124 Z"
      fill="url(#cyanBlueGrad)"
      filter="url(#softGlow)"
    />
    <!-- 3: Upper Inner Dot Matrix -->
    <path
      d="M 155,98 C 178,92 208,94 225,106 C 235,114 240,128 236,142 C 232,156 220,168 205,176 C 220,162 230,148 232,134 C 235,118 226,108 214,102 C 198,95 174,95 155,98 Z"
      fill="url(#dotPattern)"
    />
    <!-- 3: Upper Chrome Highlight Ridge -->
    <path
      d="M 138,118 C 145,84 182,70 226,72 C 270,74 290,102 282,134 C 278,110 258,84 218,80 C 180,78 148,92 138,118 Z"
      fill="url(#chromeHighlight)"
    />
    <!-- 3: Center Spine Wave -->
    <path
      d="M 195,192 C 215,196 238,206 242,226 C 246,246 228,262 204,272 C 190,278 184,272 195,264 C 218,248 228,236 224,222 C 220,208 205,200 188,196 C 180,194 182,188 195,192 Z"
      fill="url(#electricRibbon)"
    />
    <!-- 3: Lower Sweeping Crescent Base -->
    <path
      d="M 188,198 C 225,204 254,225 250,265 C 245,308 202,342 145,334 C 115,330 95,310 98,288 C 100,270 118,266 128,280 C 142,298 174,306 205,296 C 232,286 242,260 236,238 C 228,212 198,206 172,204 C 160,202 165,194 188,198 Z"
      fill="url(#deepNavyGrad)"
    />
    <!-- 3: Lower Main Ribbon Face -->
    <path
      d="M 192,202 C 230,208 260,230 255,270 C 250,312 208,348 148,340 C 116,335 96,314 100,290 C 102,272 120,268 132,282 C 146,302 178,312 210,300 C 238,290 248,262 240,240 C 232,214 200,208 174,206 C 162,204 168,198 192,202 Z"
      fill="url(#cyanBlueGrad)"
    />
    <!-- 3: Lower Dot Grid -->
    <path
      d="M 132,285 C 145,302 175,312 205,300 C 230,290 238,268 232,246 C 226,226 205,218 185,214 C 205,222 222,234 226,252 C 230,272 218,288 198,296 C 172,306 145,298 132,285 Z"
      fill="url(#dotPattern)"
    />
    <!-- 3: Lower Chrome Ridge Highlights -->
    <path
      d="M 195,206 C 232,212 256,234 252,270 C 248,240 228,220 196,212 C 182,208 184,204 195,206 Z"
      fill="url(#chromeHighlight)"
    />
    <path
      d="M 105,296 C 115,322 145,338 185,336 C 150,336 122,324 112,302 C 106,288 100,285 105,296 Z"
      fill="url(#chromeHighlight)"
      opacity="0.8"
    />

    <!-- LETTER 'S' RIBBON -->
    <!-- S: Top Tail Crest -->
    <path
      d="M 270,118 C 285,88 315,74 345,86 C 362,92 360,105 348,106 C 330,108 315,118 312,132 C 308,145 315,158 328,168 L 312,178 C 298,165 292,148 296,132 C 288,142 278,148 270,146 C 262,144 262,130 270,118 Z"
      fill="url(#deepNavyGrad)"
    />
    <!-- S: Main Flowing Top Arch -->
    <path
      d="M 276,112 C 290,82 324,70 354,82 C 368,88 366,102 352,104 C 334,106 318,118 316,134 C 312,152 324,168 338,180 C 356,196 368,214 366,242 C 362,284 322,320 268,318 C 248,316 238,306 244,295 C 250,285 264,288 280,292 C 314,298 340,280 344,250 C 348,226 335,210 320,198 C 300,182 288,162 292,138 C 295,124 286,118 276,112 Z"
      fill="url(#cyanBlueGrad)"
    />
    <!-- S: Lower Ribbon Loop -->
    <path
      d="M 338,185 C 360,202 374,224 372,254 C 368,298 326,334 266,330 C 244,328 234,316 242,304 C 248,295 262,298 278,302 C 320,310 348,288 352,254 C 356,228 344,210 326,196 Z"
      fill="url(#deepNavyGrad)"
    />
    <!-- S: Dot Matrix Texture -->
    <path
      d="M 318,136 C 314,155 324,172 338,184 C 354,198 362,216 360,240 C 356,265 342,282 322,292 C 340,278 350,258 352,238 C 354,218 344,204 330,192 C 320,182 312,168 314,150 C 316,144 316,138 318,136 Z"
      fill="url(#dotPattern)"
    />
    <!-- S: Chrome Highlights -->
    <path
      d="M 284,106 C 302,80 334,74 356,84 C 334,80 308,88 292,110 Z"
      fill="url(#chromeHighlight)"
    />
    <path
      d="M 340,188 C 358,204 370,224 368,252 C 364,228 352,212 334,196 Z"
      fill="url(#chromeHighlight)"
      opacity="0.85"
    />
    <path
      d="M 252,308 C 274,322 308,326 342,312 C 315,320 285,318 262,306 Z"
      fill="url(#chromeHighlight)"
      opacity="0.9"
    />

    <!-- Glowing Cyber Micro-nodes -->
    <circle cx="202" cy="198" r="3.5" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="288" cy="140" r="3" fill="#00ffff" />
    <circle cx="338" cy="182" r="3.5" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="132" cy="282" r="3" fill="#00ffff" />
    <circle cx="344" cy="252" r="3" fill="#00ffff" />
  </g>

  <!-- Technical Schematic Lines (Logic Gates, MCU, Resistors) -->
  <g transform="translate(100, 480)" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 0,20 H 40 L 45,10 L 55,30 L 65,10 L 75,30 L 85,10 L 95,30 L 100,20 H 130" />
    <path d="M 150,20 H 180 L 180,5 L 210,20 L 180,35 L 180,20" />
    <circle cx="215" cy="20" r="4" />
    <line x1="219" y1="20" x2="250" y2="20" />
    <path d="M 270,10 H 290 C 305,10 315,14 315,20 C 315,26 305,30 290,30 H 270 Z" />
    <line x1="315" y1="20" x2="345" y2="20" />
    <rect x="370" y="5" width="80" height="30" rx="3" stroke-dasharray="3 3" />
    <text x="390" y="24" fill="#0284c7" stroke="none" font-size="10" font-family="monospace">MCU-3S</text>
    <line x1="385" y1="0" x2="385" y2="5" />
    <line x1="410" y1="0" x2="410" y2="5" />
    <line x1="435" y1="0" x2="435" y2="5" />
    <line x1="385" y1="35" x2="385" y2="40" />
    <line x1="410" y1="35" x2="410" y2="40" />
    <line x1="435" y1="35" x2="435" y2="40" />
    <path d="M 480,8 C 488,14 488,26 480,32" />
    <path d="M 486,8 C 494,14 494,26 486,32 M 486,8 C 505,8 525,17 530,20 C 525,23 505,32 486,32" />
    <line x1="530" y1="20" x2="570" y2="20" />
  </g>

  <!-- Technical Branding & Tagline -->
  <text x="400" y="545" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="4" fill="#0f172a">
    TECH // INNOVATION // 3S
  </text>
  <text x="400" y="570" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="3" fill="#64748b">
    INTELLIGENT SYSTEMS • ARCHITECTURE • DISTRIBUTED WORKSPACE PORTAL
  </text>
</svg>
