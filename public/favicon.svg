<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="30%" stop-color="#00b4d8" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="favDeepNavy" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="favHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background disc with subtle tech border -->
  <rect width="200" height="200" rx="44" fill="#0f172a" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />

  <!-- 3S Emblem in Favicon -->
  <g transform="translate(-18, -12) scale(0.55)">
    <!-- 3 ribbon -->
    <path
      d="M 125,128 C 135,88 175,70 220,74 C 265,78 285,108 275,142 C 266,172 235,188 198,194 C 185,196 182,192 192,186 C 220,172 245,152 240,126 C 235,98 202,88 170,95 C 145,100 135,112 125,128 Z"
      fill="url(#favDeepNavy)"
    />
    <path
      d="M 132,124 C 140,82 180,64 228,68 C 275,72 296,104 286,140 C 276,175 240,192 205,198 C 190,200 188,194 200,188 C 230,174 256,150 250,122 C 244,92 206,82 172,90 C 148,96 138,108 132,124 Z"
      fill="url(#favCyanBlue)"
      filter="url(#favGlow)"
    />
    <path
      d="M 188,198 C 225,204 254,225 250,265 C 245,308 202,342 145,334 C 115,330 95,310 98,288 C 100,270 118,266 128,280 C 142,298 174,306 205,296 C 232,286 242,260 236,238 C 228,212 198,206 172,204 C 160,202 165,194 188,198 Z"
      fill="url(#favDeepNavy)"
    />
    <path
      d="M 192,202 C 230,208 260,230 255,270 C 250,312 208,348 148,340 C 116,335 96,314 100,290 C 102,272 120,268 132,282 C 146,302 178,312 210,300 C 238,290 248,262 240,240 C 232,214 200,208 174,206 C 162,204 168,198 192,202 Z"
      fill="url(#favCyanBlue)"
    />
    <path
      d="M 138,118 C 145,84 182,70 226,72 C 270,74 290,102 282,134 C 278,110 258,84 218,80 C 180,78 148,92 138,118 Z"
      fill="url(#favHighlight)"
    />

    <!-- S ribbon -->
    <path
      d="M 276,112 C 290,82 324,70 354,82 C 368,88 366,102 352,104 C 334,106 318,118 316,134 C 312,152 324,168 338,180 C 356,196 368,214 366,242 C 362,284 322,320 268,318 C 248,316 238,306 244,295 C 250,285 264,288 280,292 C 314,298 340,280 344,250 C 348,226 335,210 320,198 C 300,182 288,162 292,138 C 295,124 286,118 276,112 Z"
      fill="url(#favCyanBlue)"
      filter="url(#favGlow)"
    />
    <path
      d="M 338,185 C 360,202 374,224 372,254 C 368,298 326,334 266,330 C 244,328 234,316 242,304 C 248,295 262,298 278,302 C 320,310 348,288 352,254 C 356,228 344,210 326,196 Z"
      fill="url(#favDeepNavy)"
    />
    <path
      d="M 284,106 C 302,80 334,74 356,84 C 334,80 308,88 292,110 Z"
      fill="url(#favHighlight)"
    />

    <circle cx="202" cy="198" r="4" fill="#ffffff" />
    <circle cx="338" cy="182" r="4" fill="#ffffff" />
  </g>
